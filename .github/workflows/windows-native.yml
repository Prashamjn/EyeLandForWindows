# Windows verification of the native layer. The Linux sandbox this project is sometimes developed in has no Windows PowerShell and no
# csc, so a green result HERE is the first real proof that the C# compiles and the helpers start. It is not a hardware test: the runner has no
# Wi-Fi, Bluetooth or sound device. Operations against real devices are verified with tools/windows/diagnose.js on a real Windows 11 PC.
name: windows-native
on:
  push:
    branches: ['feature/**']
  pull_request:
jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install dependencies (FFmpeg for the Audio Studio tests; Electron itself is not needed here)
        shell: bash
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
        run: npm ci --no-audit --no-fund
      - name: Compile every native C# file (Windows PowerShell 5.1, Add-Type)
        shell: powershell
        run: .\tools\windows\compile-native.ps1
      - name: Unit tests (error transport + WinRT event bridge on powershell.exe 5.1; Audio Studio against the real Windows FFmpeg build)
        shell: bash
        run: node --test tools/tests/*.test.js
      - name: Start every real helper and read its state (no hardware on the runner)
        shell: bash
        run: node tools/windows/diagnose.js --ci
      - name: Audio Studio check (production modules, real Windows FFmpeg, measured output)
        shell: bash
        run: node tools/windows/audio-studio-check.js
      - name: Keep the diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: cc-diagnose-ci, path: diagnostics/*.json, if-no-files-found: ignore }
