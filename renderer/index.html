<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Liquid Island</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="island.css">
<link rel="stylesheet" href="dashboard.css">
</head>
<body data-theme="black" data-accent="blue" data-edge="top-flush">
<div id="island" data-state="compact" data-mini="bar">

  <!-- A. COMPACT: a plain capsule. Indicators appear only while the focus timer or Coffee mode is active. -->
  <div class="view v-compact" id="vCompact">
    <span id="cIco" class="c-ico" hidden></span>
    <span id="cTimer" class="c-timer" hidden></span>
  </div>

  <!-- B. MINI: short-lived activity (volume, brightness, charging, notices, new track). Same slots for every kind. -->
  <div class="view v-mini" id="vMini">
    <div class="mini">
      <span class="mini-ico" id="mIco"></span>
      <div class="mini-track"><div class="mini-fill" id="mFill"></div></div>
      <div class="mini-body"><span class="mini-title" id="mTitle"></span><span class="mini-sub" id="mSub"></span></div>
      <span class="mini-val" id="mVal"></span>
    </div>
  </div>

  <!-- C. FULL: activity area on top, dashboard area underneath -->
  <div class="view v-full" id="vFull">

    <!-- SECTION 1: DYNAMIC ACTIVITY AREA (one reusable component, driven by activity objects) -->
    <section class="activity" id="activity" data-kind="empty" aria-live="polite">
      <div class="act-tile" id="actTile"></div>
      <div class="act-main">
        <div class="act-title" id="actTitle"></div>
        <div class="act-sub" id="actSub"></div>
        <div class="act-track" id="actTrack" hidden><i id="actFill"></i></div>
      </div>
      <div class="act-side">
        <span class="act-val" id="actVal" hidden></span>
        <div class="act-ctrls" id="actCtrls"></div>
      </div>
    </section>

    <!-- SECTION 2: DASHBOARD AREA -->
    <section class="dash">
      <div class="views">

        <div class="vw" data-view="home">
          <div class="home">
            <div class="card clock">
              <span class="clock-bat" id="battery" hidden></span>
              <div class="clock-time" id="clockTime"></div>
              <div><div class="clock-day" id="clockDay"></div><div class="clock-date" id="clockDate"></div></div>
            </div>

            <div class="card wx" id="weather" aria-live="polite"></div>

            <div class="card qa" id="quick"></div>

            <div class="card ctl">
              <div class="ctl-row">
                <div class="ctl-top"><span id="volIcon"></span><span>Volume</span><span class="num" id="volNum">0</span></div>
                <input id="volRange" type="range" min="0" max="100" aria-label="Volume">
              </div>
              <div class="ctl-row" id="briRow">
                <div class="ctl-top"><span id="briIcon"></span><span>Brightness</span><span class="num" id="briNum">0</span></div>
                <input id="briRange" type="range" min="0" max="100" aria-label="Brightness">
              </div>
            </div>
          </div>
        </div>

        <div class="vw" data-view="plugins">
          <div class="pl">
            <div class="pl-cats" id="plCats" role="tablist"></div>
            <div class="pl-grid" id="plGrid"></div>
          </div>
        </div>

        <div class="vw" data-view="timer">
          <div class="timer view-fill">
            <div class="chips"><button data-tmode="focus">Focus</button><button data-tmode="break">Break</button></div>
            <div id="timerBig" class="timer-big">25:00</div>
            <div class="timer-bar"><i id="timerFill"></i></div>
            <div class="timer-actions">
              <button id="timerToggle" class="btn primary">Start</button>
              <button id="timerReset" class="btn">Reset</button>
            </div>
            <span id="timerCount" class="sub">0 focus sessions today</span>
          </div>
        </div>

        <div class="vw" data-view="clips">
          <div class="col">
            <div class="list-head"><span class="label">Clipboard history</span><button id="clipClear" class="link-btn">Clear</button></div>
            <div id="clipList" class="clip-list"></div>
          </div>
        </div>

        <div class="vw" data-view="tasks">
          <div class="col">
            <div class="task-add"><input id="taskInput" placeholder="Add a task and press Enter" maxlength="200" autocomplete="off"><button id="taskAdd" class="btn">Add</button></div>
            <div id="taskList" class="task-list"></div>
          </div>
        </div>

        <div class="vw" data-view="settings"><div id="settingsForm" class="settings"></div></div>
      </div>

      <nav id="nav" class="nav" aria-label="Dashboard"></nav>
    </section>
  </div>
</div>

<script src="../shared/icons.js"></script>
<script src="../shared/weather.js"></script>
<script src="core.js"></script>
<script src="activity.js"></script>
<script src="island.js"></script>
<script src="dashboard.js"></script>
<script src="panels.js"></script>
<script src="app.js"></script>
</body>
</html>
