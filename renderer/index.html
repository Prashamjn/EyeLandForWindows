<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob: liaudio:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:; connect-src 'self' blob: data:">
<title>Liquid Island</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="island.css">
<link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="workspace.css">
<link rel="stylesheet" href="plugins.css">
<link rel="stylesheet" href="audio.css">
<link rel="stylesheet" href="cc.css">
</head>
<body data-theme="black" data-accent="blue" data-edge="top-flush">
<div id="island" data-state="compact" data-mode="dash" data-mini="bar">

  <!-- A. COMPACT: a plain capsule. Indicators appear only while the focus timer or Coffee mode is active. -->
  <div class="view v-compact" id="vCompact">
    <span id="cIco" class="c-ico" hidden></span>
    <span id="cViz" class="c-viz" data-play="0" hidden aria-hidden="true"><i></i><i></i><i></i></span>
    <span id="cTimer" class="c-timer" hidden></span>
  </div>

  <!-- B. MINI: short-lived activity (volume, brightness, charging, notices, new track). Same slots for every kind. -->
  <div class="view v-mini" id="vMini">
    <div class="mini">
      <span class="mini-ico" id="mIco"></span>
      <div class="mini-track"><div class="mini-fill" id="mFill"></div></div>
      <div class="mini-body"><span class="mini-title" id="mTitle"></span><span class="mini-sub" id="mSub"></span></div>
      <span class="mini-val" id="mVal"></span>
    </div>
  </div>

  <!-- C. FULL: activity area on top, dashboard area underneath -->
  <div class="view v-full" id="vFull">

    <!-- SECTION 1: DYNAMIC ACTIVITY AREA (one reusable component, driven by activity objects) -->
    <section class="activity" id="activity" data-kind="empty" aria-live="polite">
      <div class="act-tile" id="actTile"></div>
      <div class="act-main">
        <div class="act-title" id="actTitle"></div>
        <div class="act-sub" id="actSub"></div>
        <div class="act-track" id="actTrack" hidden><i id="actFill"></i></div>
      </div>
      <div class="act-side">
        <span class="act-val" id="actVal" hidden></span>
        <div class="act-ctrls" id="actCtrls"></div>
      </div>
    </section>

    <!-- SECTION 2: DASHBOARD AREA -->
    <section class="dash">
      <div class="views">

        <div class="vw" data-view="home">
          <div class="home">
            <div class="card clock">
              <span class="clock-bat" id="battery" hidden></span>
              <div class="clock-time" id="clockTime"></div>
              <div><div class="clock-day" id="clockDay"></div><div class="clock-date" id="clockDate"></div></div>
            </div>

            <div class="card wx" id="weather" aria-live="polite"></div>

            <div class="card qa" id="quick"></div>

            <div class="card ctl">
              <div class="ctl-row">
                <div class="ctl-top"><span id="volIcon"></span><span>Volume</span><span class="num" id="volNum">0</span></div>
                <input id="volRange" type="range" min="0" max="100" aria-label="Volume">
              </div>
              <div class="ctl-row" id="briRow">
                <div class="ctl-top"><span id="briIcon"></span><span>Brightness</span><span class="num" id="briNum">0</span></div>
                <input id="briRange" type="range" min="0" max="100" aria-label="Brightness">
              </div>
            </div>
          </div>
        </div>

        <div class="vw" data-view="plugins">
          <div class="pl">
            <div class="pl-cats" id="plCats" role="tablist"></div>
            <div class="pl-grid" id="plGrid"></div>
          </div>
        </div>

        <div class="vw" data-view="timer">
          <div class="timer view-fill">
            <div class="chips"><button data-tmode="focus">Focus</button><button data-tmode="break">Break</button></div>
            <div id="timerBig" class="timer-big">25:00</div>
            <div class="timer-bar"><i id="timerFill"></i></div>
            <div class="timer-actions">
              <button id="timerToggle" class="btn primary">Start</button>
              <button id="timerReset" class="btn">Reset</button>
            </div>
            <span id="timerCount" class="sub">0 focus sessions today</span>
          </div>
        </div>

        <div class="vw" data-view="clips">
          <div class="col">
            <div class="list-head"><span class="label">Clipboard history</span><button id="clipClear" class="link-btn">Clear</button></div>
            <div id="clipList" class="clip-list"></div>
          </div>
        </div>

        <div class="vw" data-view="tasks">
          <div class="col">
            <div class="task-add"><input id="taskInput" placeholder="Add a task and press Enter" maxlength="200" autocomplete="off"><button id="taskAdd" class="btn">Add</button></div>
            <div id="taskList" class="task-list"></div>
          </div>
        </div>

        <div class="vw" data-view="settings"><div id="settingsForm" class="settings"></div></div>
      </div>

      <nav id="nav" class="nav" aria-label="Dashboard"></nav>
    </section>
  </div>
  <!-- D. WORKSPACE: one larger view that hosts a plugin page or the Control Centre. The shell morphs to its size. -->
  <div class="view v-work" id="vWork">
    <header class="wk-head">
      <button class="wk-btn" id="wkBack" title="Back" aria-label="Back"></button>
      <span class="wk-ico" id="wkIco"></span>
      <h2 class="wk-title" id="wkTitle"></h2>
      <span class="wk-key" id="wkKey" hidden></span>
      <span class="wk-spacer"></span>
      <button class="wk-btn" id="wkFav" title="Favourite" aria-label="Favourite" hidden></button>
      <button class="wk-btn" id="wkPin" title="Pin to Home" aria-label="Pin to Home" hidden></button>
      <button class="wk-btn" id="wkLock" title="Keep expanded" aria-label="Keep expanded" aria-pressed="false"></button>
      <button class="wk-btn" id="wkHome" title="Dashboard" aria-label="Dashboard"></button>
      <button class="wk-btn" id="wkClose" title="Collapse" aria-label="Collapse island"></button>
    </header>
    <div class="wk-body" id="wkBody">
      <div class="pw" id="pluginHost" hidden></div>
      <div class="cc" id="ccRoot" hidden></div>
    </div>
    <div class="wk-banner" id="wkBanner" role="status" aria-live="polite" hidden></div>
  </div>
</div>

<script src="../shared/icons.js"></script>
<script src="../shared/weather.js"></script>
<script src="../shared/catalog.js"></script>
<script src="../shared/island-logic.js"></script>
<script src="../shared/audio/timecode.js"></script>
<script src="../shared/audio/plan.js"></script>
<script src="core.js"></script>
<script src="hold.js"></script>
<script src="motion.js"></script>
<script src="plugin-host.js"></script>
<script src="plugins/calc-engine.js"></script>
<script src="plugins/qr-render.js"></script>
<script src="plugins/screen.js"></script>
<script src="plugins/todo.js"></script>
<script src="plugins/calendar.js"></script>
<script src="plugins/calc.js"></script>
<script src="plugins/weather.js"></script>
<script src="plugins/voice.js"></script>
<script src="plugins/qr.js"></script>
<script src="plugins/translate.js"></script>
<script src="plugins/convert.js"></script>
<script src="plugins/compress.js"></script>
<script src="plugins/print.js"></script>
<script src="plugins/cleaner.js"></script>

<script src="plugins/audio-common.js"></script>

<script src="plugins/audio-merge.js"></script>
<script src="activity.js"></script>
<script src="island.js"></script>
<script src="dashboard.js"></script>
<script src="panels.js"></script>
<script src="workspace.js"></script>
<script src="cc.js"></script>
<script src="notify.js"></script>
<script src="media.js"></script>
<script src="chime.js"></script>
<script src="app.js"></script>
</body>
</html>
